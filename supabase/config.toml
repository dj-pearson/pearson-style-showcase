# --- Edge function JWT settings ---
#
# These apply to the Supabase-hosted edge runtime and to local `supabase start`.
# Production does NOT use them: functions are served by the Deno server in
# danpearson-edge-functions/server.ts, whose PUBLIC_FUNCTIONS set is the
# authoritative list of unauthenticated endpoints. Keep the two in sync; they
# had drifted apart on four functions, all of which enforce requireAdmin
# internally and are correctly JWT-gated in production.

[functions.admin-auth]
verify_jwt = false

[functions.newsletter-signup]
verify_jwt = false

[functions.send-contact-email]
verify_jwt = false

[functions.generate-ai-article]
verify_jwt = true

[functions.amazon-article-pipeline]
verify_jwt = true

[functions.generate-social-content]
verify_jwt = true

[functions.send-article-webhook]
verify_jwt = true

[functions.email-webhook-receiver]
verify_jwt = false

[functions.receive-email]
verify_jwt = false

[functions.send-notification-email]
verify_jwt = true

[functions.send-ticket-email]
verify_jwt = true

[functions.test-ai-model]
verify_jwt = true

[functions.generate-ticket-response]
verify_jwt = true

[functions.extract-from-url]
verify_jwt = true

# --- Public / unauthenticated functions (US-059) ---
# These are reachable without a Supabase JWT: the OAuth provider redirects to
# oauth-proxy without a session, health-check answers monitoring probes, and
# anonymous visitors hit track-affiliate-click. Without verify_jwt = false the
# platform would 401 these before their handlers run.

[functions.oauth-proxy]
verify_jwt = false

[functions.health-check]
verify_jwt = false

[functions.track-affiliate-click]
verify_jwt = false

# --- Diagnostic/admin functions kept authenticated (reviewed, US-059) ---
# These trigger outbound side effects or probe server configuration and must
# NOT be publicly callable. verify_jwt = true is the default, set explicitly
# here to document the decision. coolify-health additionally checks the
# Authorization header itself.

[functions.slack-test]
verify_jwt = true

[functions.test-api-setup]
verify_jwt = true

[functions.coolify-health]
verify_jwt = true

# Public: reverse-proxies GoTrue for the frontend's auth calls (see
# src/integrations/supabase/client.ts). Carries email/password sign-in.
[functions.auth-proxy]
verify_jwt = false

# Public: backs the anonymous status page at /status.
[functions.health-dashboard]
verify_jwt = false
