name: CI

# Validate every pull request and every push to main:
# lint -> typecheck -> test (with coverage) -> build, plus the Deno edge
# function tests and the Playwright suites. Any failing step fails the run.
on:
  pull_request:
  push:
    # develop as well: the PRD loop lands there before main.
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node version is pinned to the repo's supported LTS (.nvmrc = 22, per US-053).
      # The PRD's original "Node 18" is superseded by US-053, which standardized on
      # Node 22 and set the package.json engines range to ">=20 <23".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Cache node_modules keyed on the lockfile so unchanged dependency trees
      # skip a full reinstall on subsequent runs.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # With coverage, so the thresholds in vitest.config.ts fail the run
      # instead of sitting unenforced. Functions was at 60.4% against a 60%
      # floor when this was switched on: new untested code can tip it.
      - name: Test (with coverage thresholds)
        run: npm run test:coverage -- --run

      - name: Build
        run: npm run build

      # Enforce per-chunk bundle budgets (size-limit, brotli). Fails the run if
      # the main bundle or a heavy vendor chunk exceeds its budget, catching
      # unintentional bloat before it reaches production.
      - name: Bundle size
        run: npm run size

      # Lighthouse CI performance/accessibility/SEO budgets on the key public
      # routes (/, /about, /news). Runs after the build, and only on the release
      # path: pushes to main and pull requests targeting main. Dummy VITE_* env
      # vars let the Supabase client boot so the app renders during collection.
      - name: Lighthouse CI
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: npm run lighthouse
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_FUNCTIONS_URL: http://localhost:54321/functions/v1

  # Edge function tests. vitest excludes supabase/**, so before this job the
  # Deno tests (webhook signatures, newsletter tokens, CORS, rate limiting,
  # vault crypto) ran only when someone remembered to. They import nothing
  # remote, so the run needs no network beyond fetching Deno itself.
  # --allow-env: cors.ts and friends read their config from Deno.env.
  # DENO_NO_PACKAGE_JSON: without it Deno reads the root package.json, finds
  # no node_modules in this job, and type checking fails looking for
  # @types/node. The edge functions do not use package.json at all.
  deno:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - name: Run Deno tests (type-checked)
        run: deno test --allow-env supabase/functions
        env:
          DENO_NO_PACKAGE_JSON: '1'

  # services/voice-engine is its own Node package (Dan Pearson's posting
  # service), with its own lockfile, typecheck and tests. Its render tests
  # start a real Chromium and ffmpeg, so both are installed here.
  voice-engine:
    name: Voice engine (typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/voice-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/voice-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The Playwright suite covers what the unit tests structurally cannot: the app
  # booting in a real browser, GSAP-animated menus settling visible, axe-core on
  # every public route, and the admin auth redirects. It had never run here, and
  # by the time it was next executed four specs were failing against a
  # navigation that had changed months earlier (US-076). A suite nobody runs is
  # not a safety net. Chromium only - Firefox doubles the wall clock and has
  # never caught a failure chromium missed on this codebase.
  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries the browser needs on the runner.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts and stops the dev server itself, with dummy
      # Supabase env; the specs mock every network call.
      - name: Run E2E tests
        run: npx playwright test --project=chromium

      # The preview project checks what a crawler without JavaScript gets:
      # the prerendered h1 on an article and /connect, and the 404 page for an
      # unknown URL. It needs the real build (vite build plus prerender), which
      # the dev server above never runs. See e2e/preview/vite.preview.config.ts
      # for how far the preview server mirrors Cloudflare Pages.
      - name: Build for the prerender E2E tests
        run: npm run build

      - name: Run prerender E2E tests (vite preview, JavaScript off)
        run: npx playwright test
        env:
          PLAYWRIGHT_PREVIEW: '1'

      # The HTML report is where a CI-only failure is actually diagnosable:
      # it carries the trace, the screenshot and the page snapshot.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-results
          retention-days: 7
