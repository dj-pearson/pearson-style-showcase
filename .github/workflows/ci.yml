name: CI

# Validate every pull request and every push to main:
# lint -> typecheck -> test -> build. Any failing step fails the run.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node version is pinned to the repo's supported LTS (.nvmrc = 22, per US-053).
      # The PRD's original "Node 18" is superseded by US-053, which standardized on
      # Node 22 and set the package.json engines range to ">=20 <23".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Cache node_modules keyed on the lockfile so unchanged dependency trees
      # skip a full reinstall on subsequent runs.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Enforce per-chunk bundle budgets (size-limit, brotli). Fails the run if
      # the main bundle or a heavy vendor chunk exceeds its budget, catching
      # unintentional bloat before it reaches production.
      - name: Bundle size
        run: npm run size
