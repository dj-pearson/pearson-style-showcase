version: '3.8'

services:
  edge-functions:
    build:
      # Context is the repository root so the build can reach supabase/functions,
      # which is the single source of truth for function code.
      context: ..
      dockerfile: danpearson-edge-functions/Dockerfile
    container_name: danpearson-edge-functions
    ports:
      - "8000:8000"
    # Every variable the functions read comes from .env (copy env.example).
    # Listing three of them here, as before, meant RESEND_API, the SMTP and AI
    # keys and the JWT secret never reached the container.
    env_file:
      - .env
    environment:
      - PORT=8000
      # Additional environment variables for danpearson.net
      - DOMAIN=functions.danpearson.net
      - API_GATEWAY_URL=https://api.danpearson.net
    volumes:
      # Mount the canonical functions directory for hot reload during development
      - ../supabase/functions:/app/functions:ro
      # Mount server.ts for development
      - ./server.ts:/app/server.ts:ro
    restart: unless-stopped
    # All functions share one Deno process. Cap it so a runaway request (an
    # oversized image decode, a leak) gets the container restarted instead of
    # starving the host. Raise EDGE_MEM_LIMIT in .env if 1g proves tight.
    mem_limit: ${EDGE_MEM_LIMIT:-1g}
    memswap_limit: ${EDGE_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - danpearson

networks:
  danpearson:
    driver: bridge

# Usage:
# 1. Copy env.example to .env and configure
# 2. Start: docker-compose up
# 3. Stop: docker-compose down
# 4. Rebuild: docker-compose up --build
# 5. View logs: docker-compose logs -f edge-functions
