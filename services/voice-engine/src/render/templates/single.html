<div class="slide single">
  {{photo_block}}
  <div class="fit grow" data-min="56"><p class="headline" style="font-size: var(--size-single)">{{headline}}</p></div>
  {{byline}}
</div>
<style>
  .single .grow { flex: 1; display: flex; align-items: center; }
  .single.has-photo { color: #fff; }
  .single.has-photo .byline .handle { color: #e8e2d6; }
  .single .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .single .scrim { position: absolute; inset: 0; background: rgba(15, 16, 20, 0.58); }
  .single .grow, .single .byline { position: relative; }
</style>
