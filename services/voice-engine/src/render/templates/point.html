  <div class="fit grow" data-min="48"><h2 class="headline" style="font-size: var(--size-headline)">{{headline}}</h2>{{body_block}}</div>
  <div class="counter">{{counter}}</div>
</div>
<style>
  .point .number {
    font-family: var(--font-display);

    font-size: 64px;

    font-variant-numeric: tabular-nums;
  }
  .point .grow { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
</style>
