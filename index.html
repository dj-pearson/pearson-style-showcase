<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Content Security Policy - Defense against XSS and injection attacks -->
    <!-- Updated to allow inline styles for React/Vite dynamic styling -->
    <!--
      Content Security Policy is defined in a single authoritative place:
      public/_headers (served as a real HTTP header by Cloudflare Pages).
      A duplicate <meta> CSP was removed here to avoid the two policies diverging
      over time. Header-based CSP is also strictly more capable than a meta CSP
      (it honors frame-ancestors, report-to, etc., which a <meta> CSP ignores).
      Edit the CSP in public/_headers only.
    -->

    <!-- Permissions Policy - Restrict browser features -->
    <meta http-equiv="Permissions-Policy" content="
      geolocation=(),
      microphone=(),
      camera=(),
      payment=(),
      usb=(),
      magnetometer=(),
      gyroscope=(),
      accelerometer=()
    ">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Google tag (gtag.js) -->
    <!--
      crossorigin="anonymous" so the script is fetched without credentials and
      is eligible for integrity checking. NOTE: a static Subresource Integrity
      (integrity="sha384-...") hash is intentionally NOT set on gtag.js — Google
      ships this file continuously without publishing stable hashes, and it
      dynamically loads further scripts that SRI cannot cover, so a pinned hash
      would break analytics on every Google update. Script provenance is instead
      constrained via the CSP script-src allow-list (googletagmanager.com).
    -->
    <script async crossorigin="anonymous" src="https://www.googletagmanager.com/gtag/js?id=G-8R95ZXMV6L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Google Consent Mode v2 — privacy by default.
      // All optional storage starts DENIED and is only granted after the visitor
      // consents via the cookie banner (see src/lib/consent.ts). This runs before
      // gtag('config') so no consent-gated data is collected until a choice is made.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });

      gtag('js', new Date());

      gtag('config', 'G-8R95ZXMV6L', { anonymize_ip: true });
    </script>


    <!--
      These defaults are the fallback for any route the prerenderer does not
      cover (scripts/prerender.mjs overwrites title, description, canonical, the
      social tags and the JSON-LD per route at build time). Keep them on the AI
      CRM automation position: for a crawler that does not run JavaScript, this
      head is the whole page.
    -->
    <title>Dan Pearson - AI CRM Automation Consultant</title>
    <meta
      name="description"
      content="AI CRM automation for revenue teams under 50 seats. Most AI CRM projects fail because they automate the reporting layer instead of the capture layer - I fix capture first, so the pipeline stops lying."
    />
    <meta name="author" content="Dan Pearson" />

    <!-- Resource hints for performance optimization -->
    <!-- Preconnect to critical third-party domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- DNS prefetch for other third-party domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    
    <!-- Inline critical CSS for LCP element -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      }
      /* Critical styles for hero heading to prevent render delay */
      h1 {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-weight: 700;
      }
    </style>
    
    <!-- Optimized font loading - CSP-compliant approach with font-display: optional for better CLS -->
    <!-- Using font-display: optional prevents layout shifts while still loading custom fonts -->
    <!-- Load fonts asynchronously to prevent render-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"></noscript>

    <!-- Canonical URL (default, updated by React for specific pages) -->
    <link rel="canonical" href="https://danpearson.net" />

    <!-- RSS Feed:
      The former <link rel="alternate" href="/rss.xml"> was removed because no
      valid RSS document is deployed at that path. The RSS feed is generated
      client-side from the database (src/pages/RSSFeed.tsx) and, on a static
      SPA host (Cloudflare Pages) with no SSR/edge rendering, /rss.xml only
      returns the HTML app shell with a text/html content-type - which RSS
      readers cannot parse. Advertising it produced a broken feed contract.
      The human-facing feed remains reachable at /feed. Re-add this link only
      once /rss.xml is served as real application/rss+xml (e.g. a Supabase edge
      function or a build-time snapshot). -->

    <!-- Default SEO meta tags (used by crawlers that don't execute JS) -->
    <meta name="keywords" content="AI CRM automation, CRM automation consultant, capture-layer automation, agentic CRM, CRM data quality, RevOps, sales automation, HubSpot automation, Salesforce automation, pipeline forecasting" />
    <meta name="robots" content="index, follow" />

    <!-- Default Open Graph (used by crawlers that don't execute JS) -->
    <meta property="og:title" content="Dan Pearson - AI CRM Automation Consultant" />
    <meta property="og:description" content="AI CRM automation for revenue teams under 50 seats - capture-layer automation that keeps the pipeline honest." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://danpearson.net" />
    <meta property="og:image" content="https://danpearson.net/android-chrome-512x512.png" />
    <meta property="og:site_name" content="Dan Pearson Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@danpearson" />
    <meta name="twitter:title" content="Dan Pearson - AI CRM Automation Consultant" />
    <meta name="twitter:description" content="AI CRM automation for revenue teams under 50 seats - capture-layer automation that keeps the pipeline honest." />
    <meta name="twitter:image" content="https://danpearson.net/android-chrome-512x512.png" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00b4d8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dan Pearson" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
