<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Content Security Policy - Defense against XSS and injection attacks -->
    <!-- Updated to allow inline styles for React/Vite dynamic styling -->
    <!--
      Content Security Policy is defined in a single authoritative place:
      public/_headers (served as a real HTTP header by Cloudflare Pages).
      A duplicate <meta> CSP was removed here to avoid the two policies diverging
      over time. Header-based CSP is also strictly more capable than a meta CSP
      (it honors frame-ancestors, report-to, etc., which a <meta> CSP ignores).
      Edit the CSP in public/_headers only.
    -->

    <!-- Permissions Policy - Restrict browser features -->
    <meta http-equiv="Permissions-Policy" content="
      geolocation=(),
      microphone=(),
      camera=(),
      payment=(),
      usb=(),
      magnetometer=(),
      gyroscope=(),
      accelerometer=()
    ">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">



    <!--
      These defaults are the fallback for any route the prerenderer does not
      cover (scripts/prerender.mjs overwrites title, description, canonical, the
      social tags and the JSON-LD per route at build time). Keep them on the AI
      CRM automation position: for a crawler that does not run JavaScript, this
      head is the whole page.
    -->
    <title>Dan Pearson - AI CRM Automation Consultant</title>
    <meta
      name="description"
      content="AI CRM automation for revenue teams under 50 seats. Most AI CRM projects fail because they automate the reporting layer instead of the capture layer - I fix capture first, so the pipeline stops lying."
    />
    <meta name="author" content="Dan Pearson" />

    <!-- Resource hints for performance optimization -->
    <!-- Preconnect to critical third-party domains -->
    <!-- crossorigin must match how each origin is fetched, or the browser opens
      a second connection: gtag.js (crossorigin="anonymous") and Supabase API
      calls are both CORS. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://api.danpearson.net" crossorigin />

    <!-- DNS prefetch for other third-party domains -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    
    <!-- Inline critical CSS for LCP element -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      }
      /* Critical styles for hero heading to prevent render delay */
      h1 {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-weight: 700;
      }
    </style>
    
    <!-- Inter is self-hosted (public/fonts, @font-face in src/index.css). The
      preload starts the woff2 fetch in parallel with the CSS; crossorigin is
      required because font requests are always CORS. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Google tag (gtag.js) -->
    <!-- public/gtag-init.js defines dataLayer, the gtag() shim and the Consent
      Mode defaults (CSP has no 'unsafe-inline'). It does not load gtag.js:
      src/lib/consent.ts injects that only after the visitor grants analytics
      consent. The script is deferred so it does not block first paint;
      deferred and module scripts run in document order, so it still runs
      before the module entry, whose initConsent() calls window.gtag.
      gtag.js is fetched with crossorigin="anonymous" (no credentials). A static
      Subresource Integrity hash is intentionally NOT set: Google ships the file
      continuously without stable hashes and it loads further scripts SRI cannot
      cover. Provenance is constrained by the CSP script-src allow-list. -->
    <script defer src="/gtag-init.js"></script>

    <!-- Canonical URL (default, updated by React for specific pages) -->
    <link rel="canonical" href="https://danpearson.net" />

    <!-- RSS Feed: scripts/prerender.mjs writes a real RSS 2.0 document to
      dist/rss.xml at build time, which Cloudflare Pages serves as a static
      asset ahead of the SPA fallback. This link was previously removed because
      /rss.xml only returned the HTML app shell; it is safe to advertise now
      that a valid feed is deployed there. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Dan Pearson - AI CRM Automation"
      href="/rss.xml"
    />

    <!-- Default SEO meta tags (used by crawlers that don't execute JS) -->
    <meta name="keywords" content="AI CRM automation, CRM automation consultant, capture-layer automation, agentic CRM, CRM data quality, RevOps, sales automation, HubSpot automation, Salesforce automation, pipeline forecasting" />
    <meta name="robots" content="index, follow" />

    <!-- Default Open Graph (used by crawlers that don't execute JS) -->
    <meta property="og:title" content="Dan Pearson - AI CRM Automation Consultant" />
    <meta property="og:description" content="AI CRM automation for revenue teams under 50 seats - capture-layer automation that keeps the pipeline honest." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://danpearson.net" />
    <meta property="og:image" content="https://danpearson.net/android-chrome-512x512.png" />
    <meta property="og:site_name" content="Dan Pearson Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@danpearson" />
    <meta name="twitter:title" content="Dan Pearson - AI CRM Automation Consultant" />
    <meta name="twitter:description" content="AI CRM automation for revenue teams under 50 seats - capture-layer automation that keeps the pipeline honest." />
    <meta name="twitter:image" content="https://danpearson.net/android-chrome-512x512.png" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00b4d8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dan Pearson" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
